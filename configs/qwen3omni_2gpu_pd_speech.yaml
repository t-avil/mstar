# 2-GPU prefill/decode disaggregation (TTFT lever, E-probe 2026-07-11).
# PD-SPEECH variant: Talker+Code2Wav moved to rank 1 (with the DECODE Thinker,
# whose states they consume every token) — kills the per-token cross-rank states
# hop that cost s2s -32% req/s / +90% audio ITL on the base PD layout.
# Rank 0: encoders + PREFILL Thinker.
# Rank 1: DECODE Thinker only (own GIL, never blocked by prefill compute).
# Rationale: i2t B16/B32 TTFT is prefill-COMPUTE-bound on the single Thinker
# GPU while the other GPU idles (~7%); full-TP is net-negative (host-bound
# decode pays per-layer all-reduce). PD-disagg uses the idle GPU's FLOPs for
# prefill without touching the decode loop. Cost: Thinker weights loaded
# twice (+~33GB on rank 0) + per-request prefill->decode KV handoff
# (kv_store transfer engine, same as orpheus PD; decode admission gates on
# retrieve completion in kv_cache_engine.check_ready).
model: "qwen3_omni"
max_seq_len: 32768
node_groups:
  - node_names: [audio_encoder, vision_encoder]
    ranks: [0]

  - node_names: [Thinker]
    ranks: [0]
    graph_walks: [prefill_text, prefill_audio, prefill_vision]

  - node_names: [Thinker]
    ranks: [1]
    graph_walks: [thinker_decode]

  - node_names: [Talker, Code2Wav]
    ranks: [1]
